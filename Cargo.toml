[workspace]
resolver = "2"
members = [
    "crates/rgis-app",
    "crates/rgis-core",
    "crates/rgis-io",
    "crates/rgis-render",
    "crates/rgis-tiles",
    "crates/rgis-web",
]
# rgis-web only compiles for wasm32 (built via `trunk`, not `cargo`), so it's
# excluded here: plain `cargo run`/`build`/`test` (no `-p`/`--workspace`) target
# just the native desktop app.
default-members = [
    "crates/rgis-app",
    "crates/rgis-core",
    "crates/rgis-io",
    "crates/rgis-render",
    "crates/rgis-tiles",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = []
repository = "https://github.com/yourname/rgis"

[workspace.dependencies]
# Async runtime
async-channel = "2"

# Geo / data
geo-types   = { version = "0.7", features = ["serde"] }
geo         = "0.33"
geozero     = { version = "0.15", features = ["with-geo"] }
geojson     = "1"
shapefile   = "0.8"
flatgeobuf  = { version = "6", default-features = false }
proj4rs     = "0.1"

# Serialisation
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Error handling
thiserror   = "1"
anyhow      = "1"
image       = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lru         = "0.12"
directories = "5"

# UI / rendering
eframe      = { version = "0.35.0", features = ["persistence"] }
egui        = "0.35.0"
wgpu        = "=29.0.4"
lyon        = "1.0.19"
bytemuck    = { version = "1.25.2", features = ["derive"] }
ehttp       = "0.7.1"
rfd         = "0.15"
poll-promise = "0.3"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
