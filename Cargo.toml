[workspace]
resolver = "2"
exclude = ["vendor/gpui-ce"]
members = [
    "crates/rgis-app",
    "crates/rgis-core",
    "crates/rgis-io",
    "crates/rgis-render",
    "crates/rgis-style",
    "crates/rgis-tiles",
    "crates/rgis-web",
]
# rgis-web only compiles for wasm32 (built via `trunk`, not `cargo`), so it's
# excluded here: plain `cargo run`/`build`/`test` (no `-p`/`--workspace`) target
# just the native desktop app.
default-members = [
    "crates/rgis-app",
    "crates/rgis-core",
    "crates/rgis-io",
    "crates/rgis-render",
    "crates/rgis-style",
    "crates/rgis-tiles",
]

# The web map uses GPUI's own wgpu device and surface compositor. This local
# fork exposes that backend lifecycle until the upstream custom-GPU API lands.
[patch."https://github.com/gpui-ce/gpui-ce"]
gpui-ce = { path = "vendor/gpui-ce/crates/gpui" }
gpui_ce_web = { path = "vendor/gpui-ce/crates/gpui_web" }
gpui_ce_platform = { path = "vendor/gpui-ce/crates/gpui_platform" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = []
repository = "https://github.com/yourname/rgis"

[workspace.dependencies]
# Async runtime
async-channel = "2"

# Geo / data
geo-types   = { version = "0.7", features = ["serde"] }
geo         = "0.33"
geozero     = { version = "0.15", features = ["with-geo"] }
geojson     = "1"
shapefile   = "0.9"
flatgeobuf  = { version = "6", default-features = false }
proj4rs     = { version = "0.1", features = ["crs-definitions", "geo-types"] }

# Serialisation
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Error handling
thiserror   = "2"
anyhow      = "1"
image       = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lru         = "0.18"
directories = "6"

# UI / rendering
wgpu        = "=29.0.4"
gpui        = { git = "https://github.com/gpui-ce/gpui-ce", rev = "0b84630eec5bb37122330ad175c8e94b148eadca", package = "gpui-ce" }
gpui-platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "0b84630eec5bb37122330ad175c8e94b148eadca", package = "gpui_ce_platform", features = ["wayland", "x11"] }
gpui-web    = { git = "https://github.com/gpui-ce/gpui-ce", rev = "0b84630eec5bb37122330ad175c8e94b148eadca", package = "gpui_ce_web", default-features = false }
rearcut     = "1.0.0"
tiny-skia   = { version = "0.11", default-features = false, features = ["std"] }
bytemuck    = { version = "1.25.2", features = ["derive"] }
ehttp       = "0.7.1"
rfd         = "0.17"
poll-promise = "0.3"
rustc-hash  = "2"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
