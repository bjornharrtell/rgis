name: Build Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-preview:
    name: Build wasm (Trunk)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      - name: Build
        working-directory: crates/rgis-web
        # Netlify previews are served from the alias subdomain root, not
        # /rgis/ like GitHub Pages, so override public_url from Trunk.toml.
        run: trunk build --release --public-url /

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: crates/rgis-web/dist

      - name: Store pull request number for later use
        run: |
          mkdir -p pr
          echo ${{ github.event.number }} > pr/number

      - name: Upload pull request number artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr
          path: pr
