name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Skip generating full debug info for CI builds; this isn't used for
  # debugging in CI and noticeably speeds up compilation/linking.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: Check, Fmt, Clippy, Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            build-essential
            pkg-config
            libwayland-dev
            libxkbcommon-dev
            libxkbcommon-x11-dev
            libfontconfig1-dev
            libfreetype6-dev
            libvulkan-dev
            libxcb1-dev
            libxcb-xkb-dev
            libxrandr-dev
            libxi-dev
            libx11-dev
            libasound2-dev
          version: 1.0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # rgis-web only compiles for wasm32 (it's checked/built by the
        # build-wasm job below), so it's excluded from this native job.
        run: cargo clippy --workspace --exclude rgis-web --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --exclude rgis-web

  build-wasm:
    name: Build (wasm32 / browser)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      - name: Build
        working-directory: crates/rgis-web
        run: trunk build --release
