name: Deploy Preview

on:
  workflow_run:
    workflows: ["Build Preview"]
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  deploy-preview:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Download pull request number
        uses: dawidd6/action-download-artifact@v24
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: pr
          path: pr
          allow_forks: true

      - name: Download site
        uses: dawidd6/action-download-artifact@v24
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: site
          path: dist
          allow_forks: true

      - name: Set pull request number
        run: echo "PR_NUMBER=$(cat pr/number)" >> "$GITHUB_ENV"

      - name: Deploy to Netlify
        id: netlify-deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@17 deploy \
            --dir=dist \
            --alias="deploy-preview-${PR_NUMBER}" \
            --message="PR #${PR_NUMBER}" \
            --json > netlify-deploy.json
          echo "deploy_url=$(jq -r '.deploy_url' netlify-deploy.json)" >> "$GITHUB_OUTPUT"

      - name: Comment on pull request
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const marker = '<!-- netlify-preview-comment -->';
            const body = `${marker}\n📦 Preview deployed to Netlify: ${{ steps.netlify-deploy.outputs.deploy_url }}`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.data.find(
              (comment) => comment.body && comment.body.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
