[package]
name = "rgis-web"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rgis-app    = { path = "../rgis-app" }

wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
js-sys = "0.3"
talc = "5"

[dependencies.web-sys]
version = "0.3"
features = ["Window"]
