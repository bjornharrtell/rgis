[package]
name = "rgis-tiles"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rgis-core   = { path = "../rgis-core" }
rgis-style  = { path = "../rgis-style" }
geo-types   = { workspace = true }
async-channel = { workspace = true }
image       = { workspace = true }
lru         = { workspace = true }
serde       = { workspace = true }
thiserror   = { workspace = true }
ehttp = { workspace = true }
serde_json  = { workspace = true }
# Mapbox Vector Tile decoding. Reader-only: we never write/encode tiles, and
# skip its `cli`/`json`/`arbitrary` extras.
fast-mvt    = { version = "0.6", default-features = false, features = ["reader"] }

# Disk tile cache is native-only; the browser has no filesystem to cache to.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = { workspace = true }
