[package]
name = "rgis-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "rgis_app"
path = "src/lib.rs"

[[bin]]
name = "rgis"
path = "src/main.rs"

[dependencies]
rgis-core   = { path = "../rgis-core" }
rgis-io     = { path = "../rgis-io" }
rgis-render = { path = "../rgis-render" }
rgis-tiles  = { path = "../rgis-tiles" }
smallvec    = "1"
geo-types   = { workspace = true }

wgpu        = { workspace = true }
image       = { workspace = true }
lru         = { workspace = true }

gpui = { package = "gpui-kit", version = "=0.9.0" }

# Native file dialogs, background loading and blocking GPU setup. The browser
# build has none of these.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster    = "0.4"
rfd         = { workspace = true }
poll-promise = { workspace = true }

# The browser build requests its GPU device and reads frames back asynchronously.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
raw-window-handle = "0.6"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
wasm-bindgen  = "0.2"
js-sys        = "0.3"
