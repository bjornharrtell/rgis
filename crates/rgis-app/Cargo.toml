[package]
name = "rgis-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "rgis_app"
path = "src/lib.rs"

[[bin]]
name = "rgis"
path = "src/main.rs"

[dependencies]
rgis-core   = { path = "../rgis-core" }
rgis-io     = { path = "../rgis-io" }
rgis-render = { path = "../rgis-render" }
rgis-tiles  = { path = "../rgis-tiles" }
smallvec    = "1"
pollster    = "0.4"
geo-types   = { workspace = true }

wgpu        = { workspace = true }
image       = { workspace = true }
rfd         = { workspace = true }
poll-promise = { workspace = true }
lru         = { workspace = true }

gpui = { package = "gpui-kit", version = "=0.9.0" }

# Native file loading uses Promise::spawn_thread (blocking IO on a background
# std::thread, needs no extra feature). The browser can't spawn OS threads, so
# wasm uses Promise::spawn_local backed by wasm-bindgen-futures instead.
[target.'cfg(target_arch = "wasm32")'.dependencies]
poll-promise = { workspace = true, features = ["web"] }
wasm-bindgen-futures = "0.4"
raw-window-handle = "0.6"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
wasm-bindgen  = "0.2"
js-sys        = "0.3"
